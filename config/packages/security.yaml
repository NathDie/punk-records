security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_CAPTAIN: [ROLE_NAKAMA]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            host: '^%api_domain%'
            pattern: ^/auth$
            stateless: true
            json_login:
                check_path: api_auth
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api:
            host: '^%api_domain%'
            stateless: true
            entry_point: jwt
            jwt: ~
            access_token:
                token_handler: App\Security\VivreCardHandler
                token_extractors: App\Security\VivreCardExtractor

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout

    access_control:
        - { host: '^%api_domain%', path: '^/auth$', roles: PUBLIC_ACCESS }
        - { host: '^%api_domain%', methods: [POST, PUT, PATCH, DELETE], roles: [ROLE_STELLA, ROLE_CAPTAIN] }
        - { host: '^%api_domain%', roles: [ROLE_STELLA, ROLE_NAKAMA] }

        - { host: '^%admin_domain%', path: '^/login', roles: [ ] }
        - { host: '^%admin_domain%', path: '^/logout', roles: [ ROLE_ADMIN, ROLE_API ] }
        - { host: '^%admin_domain%', roles: [ ROLE_ADMIN ] }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
